name: setup
description: Node, dependencies (system Chrome is preinstalled on ubuntu-latest)
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci --no-audit --no-fund
      shell: bash
      env:
        PUPPETEER_SKIP_DOWNLOAD: "1"
