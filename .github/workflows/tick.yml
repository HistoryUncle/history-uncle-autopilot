name: Tick
# The always-on bot. Each run listens to Telegram for ~55 min (answers within seconds), makes the
# scheduled drafts, then starts the next run itself. The hourly cron only restarts it if the chain breaks.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: autopilot
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node src/cli.js tick
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CHROME_PATH: /usr/bin/google-chrome
          TICK_MINUTES: "55"
      - if: always()
        uses: ./.github/actions/commit-state
        with: { message: "tick: state" }
      # Keep the bot always on: start the next run as this one ends (the hourly cron is a backup).
      - if: ${{ !cancelled() }}
        run: gh workflow run tick.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
